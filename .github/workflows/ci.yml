name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Tests
      run: npm test
      env:
        CI: true
        # Environment variables needed for tests (mocked or placeholders)
        PORT: 3000
        # Secrets are not strictly needed here because we mock external calls in tests
        # But we provide placeholders to satisfy any config checks
        GEMINI_API_KEY: "mock_key"
        GEMINI_MODEL: "gemini-2.5-flash"
        ELEVENLABS_API_KEY: "mock_key"
        ELEVENLABS_VOICE_ID: "mock_voice"
        TEACHER_EMAIL_PREMIUM: "teacher@school.com"
        TEACHER_PASSWORD_PREMIUM: "password123"
        TEACHER_EMAIL_BASIC: "basic@school.com"
        TEACHER_PASSWORD_BASIC: "password123"
        TEACHER_EMAIL_INACTIVE: "inactive@school.com"
        TEACHER_PASSWORD_INACTIVE: "password123"
