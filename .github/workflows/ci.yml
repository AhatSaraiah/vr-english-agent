name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Tests
      run: npm test
      env:
        CI: true
        # Environment variables needed for tests (mocked or placeholders)
        PORT: 3000
        # Secrets are not strictly needed here because we mock external calls in tests
        # But we provide placeholders to satisfy any config checks
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: "gemini-2.5-flash"
        ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        TEACHER_EMAIL_PREMIUM: ${{ secrets.TEACHER_EMAIL_PREMIUM }}
        TEACHER_PASSWORD_PREMIUM: ${{ secrets.TEACHER_PASSWORD_PREMIUM }}
        TEACHER_EMAIL_BASIC: ${{ secrets.TEACHER_EMAIL_BASIC }}
        TEACHER_PASSWORD_BASIC: ${{ secrets.TEACHER_PASSWORD_BASIC }}
        TEACHER_EMAIL_INACTIVE: ${{ secrets.TEACHER_EMAIL_INACTIVE }}
        TEACHER_PASSWORD_INACTIVE: ${{ secrets.TEACHER_PASSWORD_INACTIVE }}
